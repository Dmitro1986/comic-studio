<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Comic Studio — коллекция опубликованных комиксов">
  <meta property="og:title" content="Comic Studio — Галерея">
  <meta property="og:description" content="Коллекция опубликованных комиксов">
  <meta property="og:type" content="website">
  <title>Comic Studio — Галерея</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0e0e10;
      color: #e8e8ea;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
    }
    header {
      background: #1a1a1d;
      padding: 16px 24px;
      border-bottom: 1px solid #2a2a2e;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    header h1 {
      font-size: 20px;
      font-weight: 600;
      color: #e8e8ea;
    }
    header h1 span { color: #7c3aed; }
    .badge {
      background: #7c3aed;
      color: #fff;
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 4px;
      font-weight: 500;
    }
    main { padding: 24px; max-width: 1200px; margin: 0 auto; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }
    .card {
      background: #1a1a1d;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #2a2a2e;
      transition: transform 0.2s, border-color 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
    }
    .card:hover {
      transform: translateY(-4px);
      border-color: #7c3aed;
    }
    .card-thumb {
      width: 100%;
      aspect-ratio: 3/4;
      object-fit: cover;
      display: block;
      background: #2a2a2e;
    }
    .card-body { padding: 14px; }
    .card-title {
      font-size: 15px;
      font-weight: 600;
      color: #e8e8ea;
      margin-bottom: 6px;
      line-height: 1.3;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .card-meta {
      font-size: 12px;
      color: #888;
      display: flex;
      gap: 12px;
      align-items: center;
    }
    .card-meta .style-badge {
      background: #2a2a2e;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 11px;
      color: #aaa;
    }
    .empty {
      text-align: center;
      padding: 60px 20px;
      color: #666;
      font-size: 16px;
    }
    .loading {
      text-align: center;
      padding: 60px 20px;
      color: #666;
    }
    .error {
      text-align: center;
      padding: 40px;
      color: #ef4444;
      background: rgba(239,68,68,0.1);
      border-radius: 8px;
      margin: 20px;
    }
    @media (max-width: 600px) {
      main { padding: 16px; }
      .grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 12px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎨 <span>Comic Studio</span> — Галерея</h1>
    <span class="badge">Публичные комиксы</span>
  </header>
  <main>
    <div id="content">
      <div class="loading">Загрузка...</div>
    </div>
  </main>
  <script>
    async function loadGallery() {
      const el = document.getElementById('content');
      try {
        const res = await fetch('/api/comics');
        if (!res.ok) throw new Error('Ошибка загрузки');
        const comics = await res.json();
        if (!comics || comics.length === 0) {
          el.innerHTML = '<div class="empty">Пока нет опубликованных комиксов.<br><a href="/ui/" style="color:#7c3aed">Создать первый →</a></div>';
          return;
        }
        // Sort by created desc
        comics.sort((a, b) => new Date(b.created) - new Date(a.created));
        el.innerHTML = '<div class="grid">' + comics.map(c => `
          <a class="card" href="${c.url_html || '/comics/' + c.scenario_id + '.html'}">
            <img class="card-thumb" src="${c.url}" alt="${c.title}" loading="lazy"
                 onerror="this.src='/comics/${c.scenario_id}.png'">
            <div class="card-body">
              <div class="card-title">${escHtml(c.title || c.scenario_id)}</div>
              <div class="card-meta">
                <span>${formatDate(c.created)}</span>
                ${c.style ? `<span class="style-badge">${c.style}</span>` : ''}
                ${c.panels_count ? `<span>${c.panels_count} п.</span>` : ''}
              </div>
            </div>
          </a>`).join('') + '</div>';
      } catch (e) {
        el.innerHTML = `<div class="error">Не удалось загрузить галерею: ${escHtml(e.message)}</div>`;
      }
    }
    function escHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }
    function formatDate(iso) {
      if (!iso) return '';
      try {
        return new Date(iso).toLocaleDateString('ru-RU', { day: 'numeric', month: 'short', year: 'numeric' });
      } catch { return iso; }
    }
    loadGallery();
  </script>
</body>
</html>
